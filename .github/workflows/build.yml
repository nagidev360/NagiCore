name: NagiCore Build
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build
        run: msbuild NagiCore.csproj /restore /p:Configuration=Release /m
      - name: Smoke tests
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests\SmokeTests.ps1
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress
      - name: Installer
        shell: powershell
        run: iscc installer\NagiCoreInstaller.iss
      - name: Installer smoke test
        shell: powershell
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "NagiCoreInstall"
          if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }
          $log = Join-Path $env:RUNNER_TEMP "NagiCore-setup.log"
          $args = '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /LOG="' + $log + '" /DIR="' + $dir + '"'
          $p = Start-Process -FilePath (Join-Path $PWD "dist\\NagiCore-Setup.exe") -ArgumentList $args -Wait -PassThru
          if ($p.ExitCode -ne 0 -or !(Test-Path (Join-Path $dir "NagiCore.exe"))) { Write-Host "Installer exit code: $($p.ExitCode)"; if (Test-Path $log) { Get-Content $log }; Get-ChildItem $dir -Recurse -ErrorAction SilentlyContinue | Format-List FullName; throw "Fresh install failed." }
          $p = Start-Process -FilePath (Join-Path $PWD "dist\\NagiCore-Setup.exe") -ArgumentList ('/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /DIR="' + $dir + '"') -Wait -PassThru
          if ($p.ExitCode -ne 0 -or !(Test-Path (Join-Path $dir "NagiCore.exe"))) { throw "Upgrade/reinstall failed. Exit code: $($p.ExitCode)" }
          $uninstaller = Join-Path $dir "unins000.exe"
          if (!(Test-Path $uninstaller)) { throw "Uninstaller was not created." }
          $p = Start-Process -FilePath $uninstaller -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Uninstall failed. Exit code: $($p.ExitCode)" }
      - uses: actions/upload-artifact@v4
        with:
          name: NagiCore-release
          path: |
            bin\Release\NagiCore.exe
            dist\NagiCore-Setup.exe