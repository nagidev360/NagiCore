name: NagiCore Build
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build
        run: msbuild NagiCore.csproj /restore /p:Configuration=Release /m
      - name: Smoke tests\n        shell: powershell\n        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests\\SmokeTests.ps1\n      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup -y --no-progress
      - name: Installer
        shell: powershell
        run: iscc installer\NagiCoreInstaller.iss
      - uses: actions/upload-artifact@v4
        with:
          name: NagiCore-release
          path: |
            bin\Release\NagiCore.exe
            dist\NagiCore-Setup.exe